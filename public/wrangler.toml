name = "kas-kita"
main = "worker.js"
compatibility_date = "2024-09-01"

# Folder berisi file statis (index.html, manifest.json, sw.js, icon.png)
# Worker akan otomatis serve file ini untuk request selain /api/*
[assets]
directory = "./public"
binding = "ASSETS"

# Database D1 - ganti "database_id" setelah kamu membuat database di Dashboard
[[d1_databases]]
binding = "DB"
database_name = "kas-kita-db"
database_id = "GANTI_DENGAN_DATABASE_ID_DARI_DASHBOARD"

# JWT_SECRET diisi lewat Dashboard > Settings > Variables (sebagai Secret), JANGAN ditulis di sini
